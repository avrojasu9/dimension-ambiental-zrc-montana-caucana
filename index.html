<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dimensión Ambiental ZRC Montaña Caucana</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    .title-box {
      position: absolute;
      z-index: 10;
      top: 30px;
      left: 30px;
      max-width: 420px;
      padding: 20px 24px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .title-box h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .title-box p {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="title-box">
    <h1>Dimensión Ambiental</h1>

    <p>
      Zona de Reserva Campesina Montaña Caucana
    </p>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

  <script>
    const map = new maplibregl.Map({
      container: "map",

      style: {
        version: 8,

        sources: {
          osm: {
            type: "raster",
            tiles: [
              "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],
            tileSize: 256,
            attribution: "© OpenStreetMap contributors"
          }
        },

        layers: [
          {
            id: "osm",
            type: "raster",
            source: "osm"
          }
        ]
      },

      center: [-76.05, 2.55],
      zoom: 8.5
    });

    map.addControl(
      new maplibregl.NavigationControl(),
      "top-right"
    );
  </script>

</body>
</html>
